# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: lask app hola

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read
  packages: write

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.12
      uses: actions/setup-python@v3
      with:
        python-version: "3.12"
    - name: install dependencies
      run: pip install -r requirements.txt
      
    - name: construir la imagen
      run: docker build -t ghcr.io/jonathanchicaiza/holaflask:1.0.0 .

    - name: login hacia github container registry
      run: echo "${{ secrets.TOKEN_WR }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

    - name: publicar la imagen 
      run: docker push ghcr.io/jonathanchicaiza/holaflask:1.0.0
        